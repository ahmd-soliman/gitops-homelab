# Routes whoami.homelab.example (via Traefik) to whoami's Service.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: whoami
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`whoami.homelab.example`)
      kind: Rule
      services:
        - name: whoami
          port: 80
