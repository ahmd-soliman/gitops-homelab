services:
  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    restart: unless-stopped
    platform: linux/amd64

    ports:
      - "30037:30037"

    # Security hardening
    user: "568:568"
    privileged: false
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M

    environment:
      TZ: ${TZ:-UTC}
      PUID: '568'
      PGID: '568'
      GF_SERVER_HTTP_PORT: '30037'
      GF_PATHS_DATA: /var/lib/grafana/data
      GF_PATHS_PLUGINS: /var/lib/grafana/plugins
      GF_SERVER_ROOT_URL: https://grafana.homelab.example/

    volumes:
      - /mnt/data/app-config/grafana/data:/var/lib/grafana/data
      - /mnt/data/app-config/grafana/plugins:/var/lib/grafana/plugins

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30037/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
