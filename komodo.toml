# Komodo resource definitions for this repo. `resource_sync` at the bottom
# points at this exact file, so committing a change here (a new [[stack]], a
# new [[server]]) is enough — Komodo's sync procedure creates/updates/deletes
# resources to match on its next run. See README.md's "Bootstrapping Komodo"
# section for the one-time UI bootstrap this depends on.

[[server]]
name = "homelab"
[server.config]
# Same-host Periphery, reached over the docker network Komodo Core/Periphery
# share — not a public address.
address = "http://komodo-periphery:8120"
enabled = true

[[server]]
name = "runner-host"
[server.config]
# A second host — e.g. a VM or Incus container running its own Periphery.
# Add one [[server]] block per machine you deploy to.
address = "http://192.168.1.30:8120"
enabled = true

##

[[stack]]
name = "caddy"
[stack.config]
server = "homelab"
linked_repo = "gitops-homelab"
file_paths = ["apps/caddy/docker-compose.yml"]
# Komodo runs `docker compose build` before `up` so the custom Caddy image
# (xcaddy + cloudflare DNS module) rebuilds on every deploy and picks up
# Caddyfile changes baked in via the Dockerfile's COPY.
run_build = true
# auto_pull MUST be false: the image is built locally, not pulled from a
# registry — `compose pull` would fail on it.
auto_pull = false

