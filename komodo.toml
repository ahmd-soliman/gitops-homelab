##

[[repo]]
name = "gitops-homelab"
[repo.config]
server = "homelab"
git_provider = "github.com"
git_account = "oauth2"
repo = "youruser/gitops-homelab"

##

[[procedure]]
name = "pull-deploy"
description = "Pulls the repo, syncs komodo.toml, deploys anything changed"
config.schedule = "Every 10 minutes"

[[procedure.config.stage]]
name = "Pull Repo"
enabled = true
executions = [
  { execution.type = "PullRepo", execution.params.repo = "gitops-homelab", enabled = true }
]

[[procedure.config.stage]]
name = "Sync Resources"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params.sync = "resources", enabled = true }
]

[[procedure.config.stage]]
name = "Deploy if changed"
enabled = true
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "*", enabled = true }
]

##

[[resource_sync]]
name = "resources"
[resource_sync.config]
linked_repo = "gitops-homelab"
webhook_enabled = false
resource_path = ["komodo.toml"]
managed = true
delete = true
